version: "3.9"

services:
  hrpro-mysql:
    image: mysql:8.0
    container_name: hrpro-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: hrpro
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - hrpro_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10

  hrpro-backend:
    build: ./backend
    container_name: hrpro-backend
    restart: always
    depends_on:
      hrpro-mysql:
        condition: service_healthy
    environment:
      PORT: 5000
      # Trong container phai dung service name, KHONG dung localhost
      DATABASE_URL: "mysql://root:rootpassword@hrpro-mysql:3306/hrpro"
      JWT_SECRET: "doi_secret_nay_trong_production"
      JWT_EXPIRES_IN: "7d"
      NODE_ENV: "production"
      CORS_ORIGIN: "*"
    ports:
      - "5000:5000"

volumes:
  hrpro_mysql_data:
